apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  dependsOn:
    - name: databases
    - name: infrastructure
  interval: 10m
  retryInterval: 1m
  sourceRef:
    kind: GitRepository
    name: flux-system
  path: ./apps/devops-cs
  prune: true
  wait: true
  # Sloth's status has no conditions, so by default Flux would count a failed
  # generation as Ready. These report the real result of each SLO object.
  healthCheckExprs:
    - apiVersion: sloth.slok.dev/v1
      kind: PrometheusServiceLevel
      inProgress: status.observedGeneration != metadata.generation
      failed: "!status.promOpRulesGenerated"
      current: status.promOpRulesGenerated
