# yaml-language-server: $schema=https://raw.githubusercontent.com/k3d-io/k3d/refs/heads/main/pkg/config/v1alpha5/schema.json
apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: devops-cs
# k3d 5.9.0 defaults to k3s v1.35.5, which can crash-loop on first start: its
# cloud-controller-manager starts before its RoleBinding exists and k3s shuts
# down (k3s-io/k3s#7328). v1.35.6 fixed it (k3s-io/k3s#14201).
image: rancher/k3s:v1.35.8-k3s1
servers: 1
agents: 0
ports:
  - port: 8080:80
    nodeFilters:
      - loadbalancer
  - port: 8443:443
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik
        nodeFilters:
          - server:*
  k3d:
    wait: true
    timeout: 60s
