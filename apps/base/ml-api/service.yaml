apiVersion: v1
kind: Service
metadata:
  name: ml-api
  namespace: ml-api
  labels:
    app: ml-api
  annotations:
    # Checked by the shared app-endpoints probe (monitoring).
    operator.victoriametrics.com/probe-path: /health
spec:
  selector:
    app: ml-api
  ports:
    - port: 8000
      targetPort: http
      name: http
