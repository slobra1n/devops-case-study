# SLIs of ml-api. The Sloth controller (infrastructure/base/monitoring/sloth.yaml)
# generates the rules from this: PrometheusRule "ml-api", converted to VMRule "ml-api".
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: ml-api
  namespace: ml-api
spec:
  service: ml-api
  slos:
    - name: predict-availability
      alerting:
        name: MlApiPredictAvailability
      objective: 99 # 30-day target; chosen 2026-09-27
      sli:
        events:
          errorQuery: |
            sum(count_over_time(probe_success{job="probe/ml-api/predict"}[{{.window}}]))
            - sum(sum_over_time(probe_success{job="probe/ml-api/predict"}[{{.window}}]))
          totalQuery: sum(count_over_time(probe_success{job="probe/ml-api/predict"}[{{.window}}]))
    - name: predict-latency
      alerting:
        name: MlApiPredictLatency
      objective: 99 # 30-day target; chosen 2026-09-27
      sli:
        events:
          errorQuery: |
            sum(increase(ml_api_request_duration_seconds_count{endpoint="/predict"}[{{.window}}]))
            - sum(increase(ml_api_request_duration_seconds_bucket{endpoint="/predict",le="1.0"}[{{.window}}]))
          totalQuery: sum(increase(ml_api_request_duration_seconds_count{endpoint="/predict"}[{{.window}}]))
