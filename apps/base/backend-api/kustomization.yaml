apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - slo.yaml
  - alerts.yaml
# The app's Grafana board. Grafana's sidecar loads every ConfigMap labelled
# grafana_dashboard=1 in any namespace, into the folder named by grafana_folder.
configMapGenerator:
  - name: dashboard-backend-api
    namespace: backend-api
    files: [dashboard.json]
    options:
      labels: {grafana_dashboard: "1"}
      annotations: {grafana_folder: Apps}
generatorOptions:
  disableNameSuffixHash: true # nothing mounts it by name
