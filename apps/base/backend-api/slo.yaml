# SLIs of backend-api. The Sloth controller (infrastructure/base/monitoring/sloth.yaml)
# generates the rules from this: PrometheusRule "backend-api", converted to VMRule "backend-api".
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: backend-api
  namespace: backend-api
spec:
  service: backend-api
  # Sloth's rules carry only sloth_* labels. The namespace puts the SLO alerts
  # next to the app's other alerts: Alertmanager groups by it, and the app
  # board's alert list filters on it.
  labels:
    namespace: backend-api
  slos:
    - name: process-availability
      alerting:
        name: BackendApiProcessAvailability
        annotations: # opens SLO / Detail on this SLO
          dashboard: '{{ $externalURL }}/d/slo-detail?var-service={{ $labels.sloth_service }}&var-slo={{ $labels.sloth_slo }}'
      objective: 99 # 30-day target; chosen 2026-09-27
      sli:
        events:
          errorQuery: sum(increase(backend_api_requests_total{endpoint="/process",status=~"5.."}[{{.window}}])) or vector(0)
          totalQuery: sum(increase(backend_api_requests_total{endpoint="/process"}[{{.window}}]))
    - name: process-latency
      alerting:
        name: BackendApiProcessLatency
        annotations: # opens SLO / Detail on this SLO
          dashboard: '{{ $externalURL }}/d/slo-detail?var-service={{ $labels.sloth_service }}&var-slo={{ $labels.sloth_slo }}'
      objective: 99 # 30-day target; chosen 2026-09-27
      sli:
        events:
          errorQuery: |
            sum(increase(backend_api_request_duration_seconds_count{endpoint="/process"}[{{.window}}]))
            - sum(increase(backend_api_request_duration_seconds_bucket{endpoint="/process",le="0.25"}[{{.window}}]))
          totalQuery: sum(increase(backend_api_request_duration_seconds_count{endpoint="/process"}[{{.window}}]))
