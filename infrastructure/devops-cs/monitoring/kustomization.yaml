apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monitoring
patches:
  # local-path ignores the size and can't grow the existing 5Gi volume, so this
  # cluster keeps the request it was created with.
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: victoria-metrics-k8s-stack
        namespace: monitoring
      spec:
        values:
          vmsingle:
            spec:
              storage:
                resources:
                  requests:
                    storage: 5Gi
