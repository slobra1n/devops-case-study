apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/monitoring
patches:
  # local-path ignores the size and can't grow the existing 5Gi volume, so this
  # cluster keeps the request it was created with.
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: victoria-metrics-k8s-stack
        namespace: monitoring
      spec:
        values:
          vmsingle:
            spec:
              storage:
                resources:
                  requests:
                    storage: 5Gi
  # k3d's node is the Docker Desktop VM: no NTP daemon disciplines its kernel
  # clock, so node-exporter reports it as never synchronised, though it matches
  # the host within milliseconds. NodeClockSkewDetected still watches the offset.
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: victoria-metrics-k8s-stack
        namespace: monitoring
      spec:
        values:
          defaultRules:
            rules:
              NodeClockNotSynchronising:
                enabled: false
  # Grafana has no ingress here; it's reached by port-forward on localhost:3000.
  # vmalert uses this address for the alerts' dashboard and query links.
  - patch: |
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: victoria-metrics-k8s-stack
        namespace: monitoring
      spec:
        values:
          external:
            grafana:
              host: localhost:3000
