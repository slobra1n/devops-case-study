apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - helmrepository.yaml
  - helmrelease.yaml
  - sloth.yaml
  - flux-alerts.yaml
  - dashboards
# Alertmanager's routing as a ConfigMap that helmrelease.yaml reads through
# valuesFrom. A stable name keeps the reference simple; the watch label makes
# Flux upgrade the release as soon as the file changes, not at the next interval.
configMapGenerator:
  - name: alertmanager-config
    namespace: monitoring
    files: [alertmanager-config.yaml]
    options:
      disableNameSuffixHash: true
      labels: {reconcile.fluxcd.io/watch: Enabled}
