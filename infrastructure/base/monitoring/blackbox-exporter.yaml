apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: prometheus-community
  namespace: monitoring
spec:
  interval: 24h
  url: https://prometheus-community.github.io/helm-charts
---
# Prober for the VMProbe objects in helmrelease.yaml; VictoriaMetrics has no
# prober of its own. Chart defaults include the http_2xx module.
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-blackbox-exporter
  namespace: monitoring
spec:
  interval: 10m
  chart:
    spec:
      chart: prometheus-blackbox-exporter
      version: "11.19.1"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
