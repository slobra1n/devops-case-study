apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  # The operator only converts PrometheusRules (from Sloth, sloth.yaml) if the
  # CRD exists when it starts.
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.93.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  upgrade:
    crds: CreateReplace
  # Alertmanager's routing lives in its own file, alertmanager-config.yaml;
  # kustomization.yaml turns it into this ConfigMap. The values below are
  # merged over it.
  valuesFrom:
    - kind: ConfigMap
      name: alertmanager-config
      valuesKey: alertmanager-config.yaml
  values:
    # Converted VMRules get an owner reference to their PrometheusRule, so
    # deleting an SLO also deletes its rules (default: they are left running).
    victoria-metrics-operator:
      operator:
        enable_converter_ownership: true
    # Dashboards come from three places: ConfigMaps in git (dashboards/ here,
    # and each app's own board in its namespace), the chart's published set
    # (defaultDashboards below) and grafana.com (Sloth's, below). The sidecar
    # puts each ConfigMap into the folder its grafana_folder annotation names.
    # No persistence: every dashboard is provisioned, so a restart loses
    # nothing. Grafana 13's six default plugins (drilldown apps, extra data
    # sources) are disabled; the one plugin installed is VictoriaLogs'
    # data source, pinned, in the background after start: without grafana.com
    # Grafana still starts, only the logs data source is missing until the next
    # start. (The chart's `plugins` value would install it before start, and
    # Grafana then fails to start offline.)
    grafana:
      enabled: true
      grafana.ini:
        plugins:
          disable_plugins: grafana-lokiexplore-app,grafana-pyroscope-app,grafana-exploretraces-app,grafana-metricsdrilldown-app,elasticsearch,zipkin
          preinstall: victoriametrics-logs-datasource@0.32.0
        # Open on the SLO overview; everything else is linked from there or
        # from the alerts.
        dashboards:
          default_home_dashboard_path: /var/lib/grafana/dashboards/slos/sloth-overview.json
      sidecar:
        # Every app's board ConfigMap uses the key dashboard.json; without
        # this, boards in the same folder overwrite each other on disk.
        # Filenames become namespace_<ns>.configmap_<name>.<key>.
        enableUniqueFilenames: true
        dashboards:
          folderAnnotation: grafana_folder
          # Apps ship their own board next to their manifests, in their own
          # namespace (apps/base/<app>/dashboard.json).
          searchNamespace: ALL
          # The chart's default, /var/lib/grafana/dashboards, would hide the
          # downloaded Sloth dashboards below (the sidecar's volume is mounted
          # over that directory). /tmp/dashboards is the Grafana chart's default.
          folder: /tmp/dashboards
          provider:
            foldersFromFilesStructure: true
      # Sloth's own SLO dashboards, unedited, for Sloth's default 30-day period.
      # An init container downloads the pinned revisions from grafana.com at
      # every Grafana start and only swaps the import placeholder DS_PROMETHEUS
      # for our data source. If grafana.com is unreachable, Grafana still
      # starts, without these two dashboards until its next start.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: slos
              folder: SLOs
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/slos
      dashboards:
        slos:
          sloth-overview: # https://grafana.com/grafana/dashboards/14643
            gnetId: 14643
            revision: 2
            datasource: [{name: DS_PROMETHEUS, value: VictoriaMetrics}]
          sloth-detail: # https://grafana.com/grafana/dashboards/14348
            gnetId: 14348
            revision: 5
            datasource: [{name: DS_PROMETHEUS, value: VictoriaMetrics}]
    # Routes, receivers and inhibitions: alertmanager-config.yaml (valuesFrom).
    alertmanager:
      enabled: true
    vmalert:
      enabled: true
    # Platform alerts: the chart's published default rules (kube-prometheus and
    # VictoriaMetrics' own), which its sync-job downloads at every Helm upgrade
    # and turns into VMRules. Sources are pinned to the versions that run here
    # (the chart's defaults follow master). The chart already skips the groups
    # of components k3s doesn't expose (apiserver, scheduler, controller-manager,
    # etcd).
    defaultRules:
      enabled: true
      groups:
        # k3s serves the API server's metrics on the kubelet's /metrics.
        kubernetes-system:
          labelRewrites:
            job:
              match: apiserver
              value: kubelet
        # Recording rules only (API server availability); the alerts that
        # would use them are skipped with the API server scrape.
        kube-apiserver-availability.rules:
          enabled: false
      rules:
        # The backend's readiness check (SELECT 1) ends in a rollback every
        # time (the connection pool rolls back on return): 1 rollback per
        # /ready call, not an application error.
        PostgresHasTooManyRollbacks:
          enabled: false
      sources:
        alertmanager:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/alertmanager-prometheusRule.yaml
        kubernetes-control-plane:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubernetesControlPlane-prometheusRule.yaml
        kubernetes:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubePrometheus-prometheusRule.yaml
        kube-state-metrics:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubeStateMetrics-prometheusRule.yaml
        node-exporter:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/nodeExporter-prometheusRule.yaml
        vmhealth:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-health.yml
        vmagent:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-vmagent.yml
        vmalert:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-vmalert.yml
        vmsingle:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-single-node.yml
        vmoperator:
          url: https://raw.githubusercontent.com/VictoriaMetrics/operator/v0.74.1/config/alerting/vmoperator-rules.yaml
        # Not a chart default: the postgres-exporter mixin's published alerts.
        postgres-exporter:
          url: https://raw.githubusercontent.com/monitoring-mixins/website/50c46fcbdb18d37ba036dbf0de55648eb947348b/assets/postgres-exporter/alerts.yaml
        # VictoriaLogs and VLAgent health, at the version the chart runs (v1.52.0).
        vlhealth:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.52.0/deployment/docker/rules/alerts-health.yml
        vlagent:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.52.0/deployment/docker/rules/alerts-vlagent.yml
        victorialogs:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.52.0/deployment/docker/rules/alerts-vlogs.yml
    # My rules for gaps in the published ones (README, "Alerts and what they
    # catch"). The chart renders each key as VMRule
    # victoria-metrics-k8s-stack-<key>.
    # - workload-alerts: a pod that fails readiness leaves its Service, so the
    #   app's own metrics see no traffic and its SLOs stay green; these rules
    #   watch the pods.
    # - slo-alerts: an SLO that records nothing can never alert.
    # They ship in the chart because a VMRule outside it fails Flux's dry-run on
    # a fresh cluster, before the chart has installed the CRD. extraRules, not
    # extraObjects: the chart runs extraObjects through Helm's tpl, which would
    # evaluate the {{ $labels }} templates; extraRules passes them through.
    extraRules:
      workload-alerts:
        groups:
          - name: workload-alerts
            rules:
              # Every workload outside the platform namespaces, so a new app is
              # covered without a change here. Platform components have the
              # published TargetDown and KubeDeploymentReplicasMismatch tickets.
              # keep_firing_for holds the page while a crash-looping pod turns
              # Ready for a few seconds between restarts.
              - alert: DeploymentUnavailable
                expr: |
                  kube_deployment_spec_replicas{namespace!~"kube-system|flux-system|monitoring"} > 0
                  and on (namespace, deployment)
                  kube_deployment_status_replicas_available == 0
                for: 1m
                keep_firing_for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.deployment }} has no ready pod"
                  description: "No pod of {{ $labels.namespace }}/{{ $labels.deployment }} has passed its readiness probe for 1 minute, so its Service sends requests nowhere."
                  dashboard: "{{ $externalURL }}/d/85a562078cdf77779eaa1add43ccec1e?var-namespace={{ $labels.namespace }}"
              - alert: ContainerOOMKilled
                expr: |
                  increase(kube_pod_container_status_restarts_total[10m]) > 0
                  and on (namespace, pod, container)
                  kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.container }} was OOM-killed"
                  description: "Container {{ $labels.container }} in {{ $labels.namespace }}/{{ $labels.pod }} restarted in the last 10 minutes after reaching its memory limit."
                  dashboard: "{{ $externalURL }}/d/6581e46e4e5c7ba40a07646395ef7b23?var-namespace={{ $labels.namespace }}&var-pod={{ $labels.pod }}"
              # Catches a slow leak before the OOM kill; a fast one only shows
              # as ContainerOOMKilled.
              - alert: ContainerMemoryNearLimit
                expr: |
                  max by (namespace, pod, container) (container_memory_working_set_bytes{container!=""})
                  / on (namespace, pod, container)
                  max by (namespace, pod, container) (kube_pod_container_resource_limits{resource="memory"})
                  > 0.9
                for: 5m
                labels:
                  severity: warning
                annotations:
                  summary: "{{ $labels.namespace }}/{{ $labels.pod }} {{ $labels.container }} uses {{ $value | humanizePercentage }} of its memory limit"
                  description: "Container {{ $labels.container }} has used more than 90% of its memory limit for 5 minutes. At 100% the kernel kills it."
                  dashboard: "{{ $externalURL }}/d/6581e46e4e5c7ba40a07646395ef7b23?var-namespace={{ $labels.namespace }}&var-pod={{ $labels.pod }}"
      slo-alerts:
        groups:
          - name: slo-alerts
            rules:
              # Every SLO Sloth knows (sloth_slo_info) without a 5-minute error
              # ratio. A misspelled or renamed metric in slo.yaml is valid, so
              # Sloth and Flux report success while the SLO records nothing.
              # The same happens when no request reaches the service: the ratio
              # is 0/0, which VictoriaMetrics drops.
              # ponytail: 5-minute window, so a service idle for 15 minutes
              # fires too; give low-traffic services a longer window here.
              - alert: SLOHasNoData
                expr: sloth_slo_info unless on (sloth_id) slo:sli_error:ratio_rate5m
                for: 15m
                labels:
                  severity: warning
                annotations:
                  summary: "SLO {{ $labels.sloth_service }}/{{ $labels.sloth_slo }} has recorded no data for 15 minutes"
                  description: "Its SLI queries match no series, or no request reached the service. Check the metric names in the service's slo.yaml against its /metrics, then its request rate. Until it records again, none of its burn-rate alerts can fire."
                  dashboard: "{{ $externalURL }}/d/slo-detail?var-service={{ $labels.sloth_service }}&var-slo={{ $labels.sloth_slo }}"
    # Component dashboards: the chart's published set, downloaded by the same
    # sync-job and pinned the same way. One board per question: kube-prometheus'
    # Compute Resources Cluster -> Namespace (Pods) -> Pod (linked) and Node
    # Exporter / Nodes, plus the VictoriaMetrics and VictoriaLogs boards that the
    # default alerts link to.
    defaultDashboards:
      annotations:
        grafana_folder: Components
      sources:
        kube-prometheus:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/grafana-dashboardDefinitions.yaml
        victoriametrics-single-node:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/dashboards/victoriametrics.json
        victoriametrics-vmagent:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/dashboards/vmagent.json
        victoriametrics-vmalert:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/dashboards/vmalert.json
        victoriametrics-operator:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/dashboards/operator.json
        victorialogs-single-node:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.52.0/dashboards/victorialogs.json
        victorialogs-vlagent:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.52.0/dashboards/vlagent.json
        # The dotdc views repeat the kube-prometheus boards; CoreDNS isn't a
        # question here; Node Exporter Full (124 panels) is replaced by
        # Node Exporter / Nodes.
        kubernetes-views-global: {enabled: false}
        kubernetes-views-namespaces: {enabled: false}
        kubernetes-views-pods: {enabled: false}
        kubernetes-views-nodes: {enabled: false}
        kubernetes-system-coredns: {enabled: false}
        node-exporter-full: {enabled: false}
      # kube-prometheus' file holds ~30 boards: other OSes, Prometheus itself,
      # the API server (not scraped on k3s), and views that repeat the four kept.
      # Alertmanager's board is mostly empty notification panels until a
      # receiver has an integration.
      dashboards:
        alertmanager-overview: {enabled: false}
        apiserver: {enabled: false}
        cluster-total: {enabled: false}
        grafana-overview: {enabled: false}
        k8s-resources-multicluster: {enabled: false}
        k8s-resources-node: {enabled: false}
        k8s-resources-nodes-overview: {enabled: false}
        k8s-resources-windows-cluster: {enabled: false}
        k8s-resources-windows-namespace: {enabled: false}
        k8s-resources-windows-pod: {enabled: false}
        k8s-resources-workload: {enabled: false}
        k8s-resources-workloads-namespace: {enabled: false}
        k8s-windows-cluster-rsrc-use: {enabled: false}
        k8s-windows-node-rsrc-use: {enabled: false}
        kubelet: {enabled: false}
        namespace-by-pod: {enabled: false}
        namespace-by-workload: {enabled: false}
        node-cluster-rsrc-use: {enabled: false}
        node-rsrc-use: {enabled: false}
        nodes-aix: {enabled: false}
        nodes-darwin: {enabled: false}
        persistentvolumesusage: {enabled: false}
        pod-total: {enabled: false}
        prometheus: {enabled: false}
        prometheus-remote-write: {enabled: false}
        workload-total: {enabled: false}
    # Runs the rule and dashboard downloads above; if GitHub is unreachable, the
    # Helm upgrade fails and is retried. Rules and dashboards it no longer
    # generates are deleted.
    syncJob:
      enabled: true
    # Grafana data sources beyond the chart's. VictoriaLogs is listed here, not
    # in defaultDatasources.victorialogs: the chart adds that one only together
    # with its `plugins` install, which blocks Grafana's start without internet.
    defaultDatasources:
      extra:
        - name: VictoriaLogs
          uid: VictoriaLogs
          type: victoriametrics-logs-datasource
          access: proxy
          url: http://vlsingle-victoria-metrics-k8s-stack.monitoring.svc.cluster.local.:9428
          # Level for plain-text logs: one regex per level, first match wins; a
          # `level` field (JSON logs such as Flux) wins over all of them.
          # Formats: Python/uvicorn `INFO:`, logfmt `level=info`, VictoriaMetrics
          # `<tab>info<tab>`, postgres `] LOG:`, coredns `[INFO]`, klog `I0927`,
          # coloured logrus (sloth). Lines without a level word stay unknown.
          jsonData:
            logLevelRules:
              - {field: _msg, operator: regex, level: critical, value: '^CRITICAL:|level=(fatal|FATAL|panic|PANIC)|\t(fatal|panic)\t|\] (FATAL|PANIC):|^F\d{4} |^\x1b\[\d+m(FATA|PANI)'}
              - {field: _msg, operator: regex, level: error, value: '^ERROR:|level=(error|ERROR)|\terror\t|\] ERROR:|^\[ERROR\]|^E\d{4} |^\x1b\[\d+mERRO'}
              - {field: _msg, operator: regex, level: warning, value: '^WARNING:|level=(warn|WARN|warning|WARNING)|\twarn\t|\] WARNING:|^\[WARNING\]|^W\d{4} |^\x1b\[\d+mWARN'}
              - {field: _msg, operator: regex, level: info, value: '^INFO:|level=(info|INFO)|\tinfo\t|\] LOG:|^\[INFO\]|^I\d{4} |^\x1b\[\d+mINFO'}
              - {field: _msg, operator: regex, level: debug, value: '^DEBUG:|level=(debug|DEBUG)|\tdebug\t|^\[DEBUG\]|^\x1b\[\d+mDEBU'}
    # Logs: VLAgent runs on every node and ships every container's log to
    # VLSingle. Chart defaults: retention one month (31 days), 20Gi volume.
    vlsingle:
      enabled: true
    vlagent:
      enabled: true
    prometheus-node-exporter:
      enabled: true
    # k3s runs apiserver, scheduler, controller-manager and kubelet in one
    # process with one metrics registry, served identically on every /metrics
    # endpoint (https://docs.k3s.io/reference/metrics). Scrape it once, from the
    # kubelet: it runs on every node, and the standard kubelet rules expect
    # job="kubelet", metrics_path="/metrics". The API server scrape stays off.
    # ponytail: ~42k series, mostly histogram buckets; drop apiserver_/etcd_
    # *_bucket series if VMSingle's disk grows too fast.
    kubeApiServer:
      enabled: false
    kubelet:
      vmScrapes:
        kubelet:
          spec:
            # Replaces the chart default for /metrics only. The default also
            # drops `name` (meant for cAdvisor), which would merge the
            # per-controller workqueue_* and other name-keyed series.
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid)
              - action: drop
                source_labels: [__name__]
                regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    # Ready/suspended state of Flux objects as gotk_resource_info, taken from
    # Flux's official example (only the kinds this repo uses; add others when used):
    # https://github.com/fluxcd/flux2-monitoring-example/blob/main/monitoring/controllers/kube-prometheus-stack/kube-state-metrics-config.yaml
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
            resources: [gitrepositories, helmrepositories, kustomizations, helmreleases]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]
                  source_name: [spec, sourceRef, name]
              - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, history, "0", chartVersion]
                  chart_name: [status, history, "0", chartName]
                  chart_app_version: [status, history, "0", appVersion]
                  chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
    # VMSingle runs on the chart's defaults: retention "1" (one month, which
    # VictoriaMetrics counts as 31 days: the 30-day SLO window and the longest
    # calendar month for the Sloth dashboards) and a 20Gi PVC (about 16 GB at
    # today's ingest). Clusters override the PVC in their overlay.
    # Objects that use the chart's CRDs. Helm installs the CRDs first, so they
    # can ship in the same release (the chart creates VMAgent/VMSingle the same way).
    extraObjects:
      # Scrape every pod that opts in with prometheus.io/* annotations. Based on
      # the VictoriaMetrics operator docs, "Auto-discovery for prometheus.io
      # annotations": https://docs.victoriametrics.com/operator/integrations/prometheus/
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMPodScrape
        metadata:
          name: annotations-discovery
          namespace: monitoring
        spec:
          # Every pod in every namespace; the relabel rules keep only annotated ones.
          namespaceSelector:
            any: true
          selector: {}
          podMetricsEndpoints:
            - relabelConfigs:
                - action: drop
                  source_labels: [__meta_kubernetes_pod_container_init]
                  regex: "true"
                - action: keep_if_equal
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
                - action: keep
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                # regex (.+) keeps the default /metrics when the path annotation
                # is absent (the Flux controllers don't set it).
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  target_label: __metrics_path__
                  regex: (.+)
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
