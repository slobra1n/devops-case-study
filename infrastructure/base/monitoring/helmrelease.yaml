apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack
  namespace: monitoring
spec:
  # The operator only converts PrometheusRules (from Sloth, sloth.yaml) if the
  # CRD exists when it starts.
  dependsOn:
    - name: prometheus-operator-crds
  interval: 10m
  chart:
    spec:
      chart: victoria-metrics-k8s-stack
      version: "0.93.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
  upgrade:
    crds: CreateReplace
  values:
    # Converted VMRules get an owner reference to their PrometheusRule, so
    # deleting an SLO also deletes its rules (default: they are left running).
    victoria-metrics-operator:
      operator:
        enable_converter_ownership: true
    # Dashboards come from ConfigMaps in git (dashboards/); the sidecar puts each
    # into the folder its grafana_folder annotation names. No persistence: every
    # dashboard is provisioned, so a restart loses nothing. Grafana's
    # preinstalled plugins (drilldown apps, extra data sources) are off; the
    # dashboards use only built-in panels and Prometheus.
    grafana:
      enabled: true
      grafana.ini:
        plugins:
          preinstall_disabled: true
      sidecar:
        dashboards:
          folderAnnotation: grafana_folder
          # The chart's default, /var/lib/grafana/dashboards, would hide the
          # downloaded Sloth dashboards below (the sidecar's volume is mounted
          # over that directory). /tmp/dashboards is the Grafana chart's default.
          folder: /tmp/dashboards
          provider:
            foldersFromFilesStructure: true
      # Sloth's own SLO dashboards, unedited, for Sloth's default 30-day period.
      # An init container downloads the pinned revisions from grafana.com at
      # every Grafana start and only swaps the import placeholder DS_PROMETHEUS
      # for our data source. If grafana.com is unreachable, Grafana still
      # starts, without these two dashboards until its next start.
      dashboardProviders:
        dashboardproviders.yaml:
          apiVersion: 1
          providers:
            - name: slos
              folder: SLOs
              type: file
              disableDeletion: true
              editable: false
              options:
                path: /var/lib/grafana/dashboards/slos
      dashboards:
        slos:
          sloth-overview: # https://grafana.com/grafana/dashboards/14643
            gnetId: 14643
            revision: 2
            datasource: [{name: DS_PROMETHEUS, value: VictoriaMetrics}]
          sloth-detail: # https://grafana.com/grafana/dashboards/14348
            gnetId: 14348
            revision: 5
            datasource: [{name: DS_PROMETHEUS, value: VictoriaMetrics}]
    # Alert routing (docs/superpowers/specs/2026-09-27-alerting-design.md):
    # kube-prometheus' published Alertmanager config
    # (https://github.com/prometheus-operator/kube-prometheus/blob/v0.19.0/manifests/alertmanager-secret.yaml)
    # plus the Sloth routes. Pages: Sloth fast burn and severity=critical;
    # everything else is a ticket. The receivers have no integrations yet:
    # alerts are visible in the Alertmanager UI and Grafana only.
    alertmanager:
      enabled: true
      config:
        global:
          # Flux events (flux-alerts.yaml) carry no end time; Flux's docs suggest
          # an hour. vmalert's alerts carry end times and are unaffected.
          resolve_timeout: 1h
        route:
          receiver: ticket # tickets, and anything unrouted still reaches a human
          group_by: [namespace, alertname, sloth_id]
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            - matchers: ['alertname="Watchdog"'] # always firing: proves the pipeline works
              receiver: watchdog
            - matchers: ['alertname="InfoInhibitor"']
              receiver: "null"
            - matchers: ['sloth_severity="page"']
              receiver: page
            - matchers: ['severity="critical"']
              receiver: page
        receivers:
          - name: page
          - name: ticket
          - name: watchdog
          - name: "null"
        inhibit_rules:
          # The workbook's suppression: a page silences the ticket of the same SLO.
          - source_matchers: ['sloth_severity="page"']
            target_matchers: ['sloth_severity="ticket"']
            equal: [sloth_id]
          # kube-prometheus: critical silences warning/info of the same alert,
          # warning silences info, and info alerts alone never notify.
          - source_matchers: ['severity="critical"']
            target_matchers: ['severity=~"warning|info"']
            equal: [namespace, alertname]
          - source_matchers: ['severity="warning"']
            target_matchers: ['severity="info"']
            equal: [namespace, alertname]
          - source_matchers: ['alertname="InfoInhibitor"']
            target_matchers: ['severity="info"']
            equal: [namespace]
    vmalert:
      enabled: true
    # Platform alerts: the chart's published default rules (kube-prometheus and
    # VictoriaMetrics' own), which its sync-job downloads at every Helm upgrade
    # and turns into VMRules. Sources are pinned to the versions that run here
    # (the chart's defaults follow master). The chart already skips the groups
    # of components k3s doesn't expose (apiserver, scheduler, controller-manager,
    # etcd). Dashboards stay off.
    defaultRules:
      enabled: true
      groups:
        # k3s serves the API server's metrics on the kubelet's /metrics.
        kubernetes-system:
          labelRewrites:
            job:
              match: apiserver
              value: kubelet
        # Recording rules only (API server availability); the alerts that
        # would use them are skipped with the API server scrape.
        kube-apiserver-availability.rules:
          enabled: false
      rules:
        # The backend's readiness check (SELECT 1) ends in a rollback every
        # time (the connection pool rolls back on return): 1 rollback per
        # /ready call, not an application error.
        PostgresHasTooManyRollbacks:
          enabled: false
      sources:
        alertmanager:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/alertmanager-prometheusRule.yaml
        kubernetes-control-plane:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubernetesControlPlane-prometheusRule.yaml
        kubernetes:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubePrometheus-prometheusRule.yaml
        kube-state-metrics:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubeStateMetrics-prometheusRule.yaml
        node-exporter:
          url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/nodeExporter-prometheusRule.yaml
        vmhealth:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-health.yml
        vmagent:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-vmagent.yml
        vmalert:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-vmalert.yml
        vmsingle:
          url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.152.0/deployment/docker/rules/alerts-single-node.yml
        vmoperator:
          url: https://raw.githubusercontent.com/VictoriaMetrics/operator/v0.74.1/config/alerting/vmoperator-rules.yaml
        # Not a chart default: the postgres-exporter mixin's published alerts.
        postgres-exporter:
          url: https://raw.githubusercontent.com/monitoring-mixins/website/50c46fcbdb18d37ba036dbf0de55648eb947348b/assets/postgres-exporter/alerts.yaml
    defaultDashboards:
      enabled: false
    # Runs the rule download above; if GitHub is unreachable, the Helm upgrade
    # fails and is retried. Rules it no longer generates are deleted.
    syncJob:
      enabled: true
    prometheus-node-exporter:
      enabled: true
    # k3s runs apiserver, scheduler, controller-manager and kubelet in one
    # process with one metrics registry, served identically on every /metrics
    # endpoint (https://docs.k3s.io/reference/metrics). Scrape it once, from the
    # kubelet: it runs on every node, and the standard kubelet rules expect
    # job="kubelet", metrics_path="/metrics". The API server scrape stays off.
    # ponytail: ~42k series, mostly histogram buckets; drop apiserver_/etcd_
    # *_bucket series if VMSingle's disk grows too fast.
    kubeApiServer:
      enabled: false
    kubelet:
      vmScrapes:
        kubelet:
          spec:
            # Replaces the chart default for /metrics only. The default also
            # drops `name` (meant for cAdvisor), which would merge the
            # per-controller workqueue_* and other name-keyed series.
            metricRelabelConfigs:
              - action: labeldrop
                regex: (uid)
              - action: drop
                source_labels: [__name__]
                regex: (rest_client_request_duration_seconds_bucket|rest_client_request_duration_seconds_sum|rest_client_request_duration_seconds_count)
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    # Ready/suspended state of Flux objects as gotk_resource_info, taken from
    # Flux's official example (only the kinds this repo uses; add others when used):
    # https://github.com/fluxcd/flux2-monitoring-example/blob/main/monitoring/controllers/kube-prometheus-stack/kube-state-metrics-config.yaml
    kube-state-metrics:
      rbac:
        extraRules:
          - apiGroups: [source.toolkit.fluxcd.io, kustomize.toolkit.fluxcd.io, helm.toolkit.fluxcd.io]
            resources: [gitrepositories, helmrepositories, kustomizations, helmreleases]
            verbs: [list, watch]
      customResourceState:
        enabled: true
        config:
          spec:
            resources:
              - groupVersionKind: {group: kustomize.toolkit.fluxcd.io, version: v1, kind: Kustomization}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux Kustomization resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, lastAppliedRevision]
                  source_name: [spec, sourceRef, name]
              - groupVersionKind: {group: helm.toolkit.fluxcd.io, version: v2, kind: HelmRelease}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRelease resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, history, "0", chartVersion]
                  chart_name: [status, history, "0", chartName]
                  chart_app_version: [status, history, "0", appVersion]
                  chart_source_name: [spec, chart, spec, sourceRef, name]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: GitRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux GitRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
              - groupVersionKind: {group: source.toolkit.fluxcd.io, version: v1, kind: HelmRepository}
                metricNamePrefix: gotk
                metrics:
                  - name: resource_info
                    help: The current state of a Flux HelmRepository resource.
                    each:
                      type: Info
                      info:
                        labelsFromPath:
                          name: [metadata, name]
                labelsFromPath:
                  exported_namespace: [metadata, namespace]
                  ready: [status, conditions, "[type=Ready]", status]
                  suspended: [spec, suspend]
                  revision: [status, artifact, revision]
                  url: [spec, url]
    # VMSingle runs on the chart's defaults: retention "1" (one month, which
    # VictoriaMetrics counts as 31 days: the 30-day SLO window and the longest
    # calendar month for the Sloth dashboards) and a 20Gi PVC (about 16 GB at
    # today's ingest, measured in the SLO spec). Clusters override the PVC in
    # their overlay.
    # Objects that use the chart's CRDs. Helm installs the CRDs first, so they
    # can ship in the same release (the chart creates VMAgent/VMSingle the same way).
    extraObjects:
      # Scrape every pod that opts in with prometheus.io/* annotations. Based on
      # the VictoriaMetrics operator docs, "Auto-discovery for prometheus.io
      # annotations": https://docs.victoriametrics.com/operator/integrations/prometheus/
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMPodScrape
        metadata:
          name: annotations-discovery
          namespace: monitoring
        spec:
          # Every pod in every namespace; the relabel rules keep only annotated ones.
          namespaceSelector:
            any: true
          selector: {}
          podMetricsEndpoints:
            - relabelConfigs:
                - action: drop
                  source_labels: [__meta_kubernetes_pod_container_init]
                  regex: "true"
                - action: keep_if_equal
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_port, __meta_kubernetes_pod_container_port_number]
                - action: keep
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                  regex: "true"
                # regex (.+) keeps the default /metrics when the path annotation
                # is absent (the Flux controllers don't set it).
                - action: replace
                  source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                  target_label: __metrics_path__
                  regex: (.+)
                - action: replace
                  source_labels: [__meta_kubernetes_pod_node_name]
                  target_label: node
      # Check the apps from outside, through their Services, like a client would.
      # The blackbox exporter (blackbox-exporter.yaml) runs the HTTP checks.
      - apiVersion: operator.victoriametrics.com/v1beta1
        kind: VMProbe
        metadata:
          name: app-endpoints
          namespace: monitoring
        spec:
          vmProberSpec:
            url: prometheus-blackbox-exporter.monitoring.svc.cluster.local:9115
          module: http_2xx
          targets:
            staticConfig:
              targets:
                - http://ml-api.ml-api.svc.cluster.local:8000/health
                - http://backend-api.backend-api.svc.cluster.local:8000/ready
